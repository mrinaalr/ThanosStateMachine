[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thanos-state-machine"
version = "2.1.0"
description = "The Infinity Saga as an offense/harm state machine: offender-centric campaign trajectory + guardian-side search over 14,000,605 futures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mrinaal Ramachandran" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
strange-report = "thanos_state_machine.search:strange_report_cli"
strange-search = "thanos_state_machine.simulate:main"
thanos-reward = "thanos_state_machine.reward:reward_report_cli"
is-it-exploitation = "thanos_state_machine.exploitation:exploitation_report_cli"
futures-atlas = "thanos_state_machine.futures:atlas_report_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thanos_state_machine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
